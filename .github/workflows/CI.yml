name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref != 'refs/heads/main') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

env:
  PYTHON: ~
  OPENBLAS_NUM_THREADS: '1'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      JULIA_LOAD_PATH: ${{ startsWith(matrix.os, 'windows-') && '@;@stdlib' || '@:@stdlib' }}
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Julia minimum - Linux - 1 thread
            version: min
            os: ubuntu-latest
            arch: x64
            threads: '1'
            coverage: false
          - name: Julia latest - Linux - 1 thread
            version: '1'
            os: ubuntu-latest
            arch: x64
            threads: '1'
            coverage: true
          - name: Julia latest - Windows - 1 thread
            version: '1'
            os: windows-latest
            arch: x64
            threads: '1'
            coverage: false
          - name: Julia latest - macOS - 1 thread
            version: '1'
            os: macos-latest
            arch: default
            threads: '1'
            coverage: false
          - name: Julia latest - Linux - 4 threads
            version: '1'
            os: ubuntu-latest
            arch: x64
            threads: '4'
            coverage: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Check CI environment preparation
        shell: julia --startup-file=no --color=yes {0}
        run: include(joinpath(ENV["GITHUB_WORKSPACE"], ".github", "ci", "test-prepare-environment.jl"))
      - name: Prepare isolated test environment
        shell: julia --startup-file=no --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          workspace = ENV["GITHUB_WORKSPACE"]
          include(joinpath(workspace, ".github", "ci", "prepare-environment.jl"))
          project = prepare_environment("test"; root=workspace)
          open(ENV["GITHUB_ENV"], "a") do io
              println(io, "MKI_TEST_PROJECT=", project)
          end
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ env.MKI_TEST_PROJECT }}
      - name: Run package tests
        shell: julia --startup-file=no --color=yes {0}
        env:
          MKI_COVERAGE: ${{ matrix.coverage && 'user' || 'none' }}
        run: |
          workspace = ENV["GITHUB_WORKSPACE"]
          project = ENV["MKI_TEST_PROJECT"]
          coverage = ENV["MKI_COVERAGE"]
          tests = joinpath(workspace, "test", "runtests.jl")
          run(Cmd(`$(Base.julia_cmd()) --startup-file=no --check-bounds=yes --depwarn=yes --code-coverage=$coverage --project=$project --color=yes $tests`; dir=workspace))
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v6
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
